<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>

<body class="h-screen w-1/1 flex items-center justify-center">
    <form action="/login" method="POST" id="loginForm">
        <div
            class="flex flex-col gap-10 items-center justify-center mx-auto min-w-lg max-w-xl bg-gray-200 rounded-xl p-10">
            <p class="text-4xl font-bold">Login</p>
            <div class="flex flex-col gap-4">
                <input type="text" name="username" id="username" class="border rounded-lg p-2" placeholder="Username">
                <input type="password" name="password" id="password" class="border rounded-lg p-2"
                    placeholder="Password">
            </div>
            <button type="submit"
                class="bg-emerald-700 px-4 py-2 text-white hover:cursor-pointer hover:bg-emerald-800">Login</button>

            <p id="messagelogin" class="text-xl text-red-500"></p>
        </div>
    </form>

    <script src="./script.js"></script>
</body>

</html>
